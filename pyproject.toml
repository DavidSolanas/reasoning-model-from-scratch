[project]
name = "reasoning-model-from-scratch"
version = "0.1.0"
description = 'Code following "Build a Reasoning Model (From Scratch)": Qwen3-based generation and MATH-500 evaluation, developed chapter by chapter.'
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "reasoning-from-scratch>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmfs"]
